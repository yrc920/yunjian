syntax = "proto3";

package message;

// 邮箱验证码服务，由 GateServer 在客户端注册/找回密码时调用，客户端不直接访问。
// 通用约定：gRPC 调用本身始终返回 OK，业务结果放在响应报文的 error 字段里。
service VerifyService {
  // 为指定邮箱生成验证码并发送邮件；验证码在有效期内重复申请会复用同一个，不会重复生成
  rpc GetVerifyCode (GetVerifyReq) returns (GetVerifyRsp) {}
}

// 获取邮箱验证码的请求
message GetVerifyReq {
  // 接收验证码的邮箱，同时作为 Redis 缓存键 code_<email> 的组成部分
  string email = 1;
}

// 获取邮箱验证码的响应
message GetVerifyRsp {
  // 业务错误码，0 表示成功；Redis 不可用、发信失败等取值见 VerifyServer 的 VerifyCodes
  int32 error = 1;
  // 回显请求中的邮箱，便于调用方把异步结果和请求对上
  string email = 2;
  // 预留字段：当前实现不回填，验证码只通过邮件下发，不返回给调用方
  string code = 3;
}

// 状态服务：登录选路、会话租约、在线位置查询与实例注册。
// 租约是"某个 uid 当前由哪条连接占用"的唯一权威，ChatServer 不再直接读写在线状态键。
service StatusService {
  // 网关登录时调用：按实例负载挑选一台 ChatServer，签发本次会话的 token
  rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
  // 登录成功后申请租约：校验 token、分配单调递增的 epoch、顶掉同账号旧会话
  rpc AllocateSession (AllocateSessionReq) returns (AllocateSessionRsp) {}
  // 批量续租，同时上报本实例连接数与在线会话数
  rpc RenewSessions (RenewSessionsReq) returns (RenewSessionsRsp) {}
  // 断开连接时释放租约；epoch 不匹配表示已被新会话顶替，只记录不删除
  rpc ReleaseSession (ReleaseSessionReq) returns (ReleaseSessionRsp) {}
  rpc LogoutSession (LogoutSessionReq) returns (LogoutSessionRsp) {}
  // 查询单个用户的在线位置
  rpc LookupRoute (LookupRouteReq) returns (LookupRouteRsp) {}
  // 批量查询在线位置，群广播与资料推送使用
  rpc BatchLookupRoute (BatchLookupRouteReq) returns (BatchLookupRouteRsp) {}
  // ChatServer 启动时注册自身地址与容量，之后用心跳续期
  rpc RegisterInstance (RegisterInstanceReq) returns (RegisterInstanceRsp) {}
  // 实例主动下线，立即从可选列表中移除
  rpc UnregisterInstance (UnregisterInstanceReq) returns (UnregisterInstanceRsp) {}
  // 运维下线：停止向该实例分配新登录，已有会话在宽限期后自然迁走
  rpc DrainInstance (DrainInstanceReq) returns (DrainInstanceRsp) {}
}

// 申请分配 ChatServer 的请求
message GetChatServerReq {
  // 已通过密码校验的用户 ID，分配结果与它无关，仅用于日志和令牌绑定
  int32 uid = 1;
}

// 分配 ChatServer 的响应
message GetChatServerRsp {
  // 业务错误码，0 表示成功
  int32 error = 1;
  // 分配到的 ChatServer 地址，客户端据此建立 TCP 长连接
  string host = 2;
  // ChatServer 的 TCP 端口，配置里以字符串形式保存，故此处也用 string
  string port = 3;
  // 本次会话令牌，由 StatusServer 生成并写入 Redis 的 utoken_<uid>，客户端拿它向 ChatServer 证明身份
  string token = 4;
  // 资源服务器地址，客户端据此上传头像、下载缺失资源；未配置资源服务器时为空
  string res_host = 5;
  // 资源服务器 TCP 端口，与 res_host 配对
  string res_port = 6;
}

// 申请会话租约的请求
message AllocateSessionReq {
  // 已通过密码校验的用户 ID
  int32 uid = 1;
  // 网关签发、客户端带回的会话令牌，StatusServer 负责校验
  string token = 2;
  // 本次 TCP 连接的 UUID，用来区分同一 uid 的不同连接
  string session_id = 3;
  // 发起申请的 ChatServer 实例名
  string instance = 4;
  // 设备类别，单端登录时恒为 0；预留多端登录，主键仍按 uid 收敛
  int32 device_class = 5;
}

// 申请会话租约的响应
message AllocateSessionRsp {
  // 0 成功；TokenInvalid / UidInvalid / ServiceUnavailable 见错误码定义
  int32 error = 1;
  // 本次会话的围栏令牌，按 uid 单调递增，永不重复
  int64 epoch = 2;
  // 租约有效期（秒），ChatServer 按它的三分之一续租
  int32 lease_seconds = 3;
  // 被顶替的实例名，空表示此前没有在线会话
  string kicked_instance = 4;
  // 被顶替的目标 uid，便于日志对齐
  int32 kicked_uid = 5;
}

// 单个会话的租约引用
message SessionLeaseRef {
  int32 uid = 1;
  string session_id = 2;
  int64 epoch = 3;
}

// 批量续租请求
message RenewSessionsReq {
  // 发起续租的实例名，必须已注册
  string instance = 1;
  repeated SessionLeaseRef items = 2;
  // 本实例当前未过期的 TCP 连接数，含未登录连接
  int32 conn_count = 3;
  // 本实例当前已认证会话数，调度按它计算负载
  int32 session_count = 4;
}

// 单条续租结果
message SessionLeaseResult {
  // 0 正常续期 / 1 租约已过期并重新授予 / 2 已被更高 epoch 顶替 / 3 参数或内部错误
  int32 status = 1;
  int32 uid = 2;
  // 当前生效的 epoch；status=1 时是重新授予的新值
  int64 epoch = 3;
  // 对应的连接 ID：同一 uid 可能同时存在新旧两条连接，结果必须按连接而不是 uid 匹配
  string session_id = 4;
}

// 批量续租响应
message RenewSessionsRsp {
  int32 error = 1;
  repeated SessionLeaseResult items = 2;
  // 实例正在被运维下线，ChatServer 据此拒绝新登录并准备迁移
  bool draining = 3;
}

// 释放租约的请求
message ReleaseSessionReq {
  int32 uid = 1;
  string session_id = 2;
  int64 epoch = 3;
}

// 释放租约的响应
message ReleaseSessionRsp {
  int32 error = 1;
  // true 表示确实删除了租约；false 表示已被顶替或本就过期
  bool released = 2;
}

// 显式登出：释放租约并吊销令牌
message LogoutSessionReq {
  int32 uid = 1;
  string session_id = 2;
  // 只有当前租约的持有者才能吊销令牌，避免被顶掉的旧连接影响新会话
  int64 epoch = 3;
}

message LogoutSessionRsp {
  int32 error = 1;
  // 租约与令牌都已删除时为 true；会话已被顶替或已过期时为 false
  bool revoked = 2;
}

// 单用户位置查询
message LookupRouteReq {
  int32 uid = 1;
}

message LookupRouteRsp {
  int32 error = 1;
  bool online = 2;
  // 在线时为用户所在实例名
  string instance = 3;
  int64 epoch = 4;
}

// 批量位置查询
message BatchLookupRouteReq {
  repeated int32 uids = 1;
}

message RouteEntry {
  int32 uid = 1;
  bool online = 2;
  string instance = 3;
  int64 epoch = 4;
}

message BatchLookupRouteRsp {
  int32 error = 1;
  repeated RouteEntry entries = 2;
}

// 实例注册
message RegisterInstanceReq {
  // 实例名，必须存在于 StatusServer 的配置白名单
  string name = 1;
  // 客户端可访问的地址，随登录路由下发给客户端
  string host = 2;
  // 客户端连接的 TCP 端口
  int32 client_port = 3;
  // 实例间 gRPC 端口
  int32 rpc_port = 4;
  // 该实例期望承载的会话数，用于加权调度
  int32 capacity = 5;
  // 实例间 RPC 使用的主机名；容器部署时与客户端地址不同，留空表示与 host 相同
  string rpc_host = 6;
}

message RegisterInstanceRsp {
  int32 error = 1;
  // 建议的心跳间隔（秒）
  int32 heartbeat_seconds = 2;
  bool draining = 3;
}

// 实例注销
message UnregisterInstanceReq {
  string name = 1;
}

message UnregisterInstanceRsp {
  int32 error = 1;
}

// 实例下线
message DrainInstanceReq {
  string name = 1;
  // 宽限时间（秒），期间已有会话仍可续租
  int32 grace_seconds = 2;
}

message DrainInstanceRsp {
  int32 error = 1;
}

// 聊天服务，仅在 ChatServer 实例之间互相调用，客户端不直接访问。
// 每个实例既是服务端也是客户端：先查本地路由缓存，未命中向 StatusServer 查询实例名，再发起调用。
// 通用约定：RPC 调用成功不代表业务成功，具体结果看响应报文的 error 字段。
service ChatService {
  // 跨实例通知：有人申请加你为好友，由申请人所在实例发给被申请人所在实例
  rpc NotifyAddFriend (AddFriendReq) returns (AddFriendRsp) {}
  // 跨实例通知：对方已通过你的好友申请，由通过方所在实例发给申请方所在实例
  rpc NotifyAuthFriend (AuthFriendReq) returns (AuthFriendRsp) {}
  // 跨实例转发聊天消息，接收方不在本实例时使用
  rpc NotifyTextChatMsg (TextChatMsgReq) returns (TextChatMsgRsp) {}
  // 租约被新登录顶替时由 StatusServer 调用，通知旧实例关闭连接。
  // 这是尽力通知：即使丢失，旧连接也会在下一次续租收到 Fenced 后自行断开
  rpc KickSession (KickSessionReq) returns (KickSessionRsp) {}
  // 资源服务器在聊天图片/视频/文件完整落盘后通知 ChatServer 把消息标记为已上传
  rpc NotifyImageUploaded (NotifyImageUploadedReq) returns (NotifyImageUploadedRsp) {}
  // 资源服务器改了头像后，让用户所在实例把新资料推给他的在线好友
  rpc BroadcastProfile (BroadcastProfileReq) returns (BroadcastProfileRsp) {}
  // 跨实例：把某人的资料变更推给对端实例上的若干好友（批量，一次一个实例）
  rpc NotifyProfileChanged (ProfileChangedReq) returns (ProfileChangedRsp) {}
  // 跨实例会话事件：已读上报或撤回，转给对方所在实例再推给客户端
  rpc NotifyChatEvent (ChatEventReq) returns (ChatEventRsp) {}
  // 跨实例群事件：群消息、资源就绪、群资料/成员变动、群内撤回。
  // 群成员分散在多个实例上，发送方按实例聚合后用一次调用把同一份通知投递过去
  rpc NotifyGroupEvent (GroupEventReq) returns (GroupEventRsp) {}
}

// 跨实例群事件的请求
message GroupEventReq {
  // 群会话 ID，接收方只用于日志与定位
  int64 thread_id = 1;
  // 目标实例上需要收到通知的成员，接收方逐个查找本机会话
  repeated int32 touids = 2;
  // 客户端消息 ID：1019 文本 / 1033 图片 / 1036 视频文件 / 1057 撤回 / 1068 群变更
  int32 notify_id = 3;
  // 直接下发给客户端的 JSON。群事件字段差异大（文本、资源、成员变动各不相同），
  // proto 只承担"把同一份通知送到目标实例"的职责，客户端仍按 JSON 解析
  string payload = 4;
}

// 跨实例群事件的响应
message GroupEventRsp {
  // 业务错误码，0 表示已投递；目标实例不可达时返回非 0，由发送方记录日志
  int32 error = 1;
}

// 好友申请通知
message AddFriendReq {
  // 发起申请的用户 ID
  int32 applyuid = 1;
  // 申请人用户名，接收方直接展示，免去再查一次用户资料
  string name = 2;
  // 申请附言，当前调用点固定传空串，字段保留
  string desc = 3;
  // 申请人头像地址，随通知一起带给接收方
  string icon = 4;
  // 申请人昵称，随通知一起带给接收方
  string nick = 5;
  // 申请人性别，随通知一起带给接收方
  int32 sex = 6;
  // 被申请人（接收通知的一方）的用户 ID
  int32 touid = 7;
}

// 好友申请通知的响应
message AddFriendRsp {
  // 业务错误码，0 表示成功；接收方不在线时也按成功处理
  int32 error = 1;
  // 回显申请人 ID，便于调用方匹配在途请求
  int32 applyuid = 2;
  // 回显被申请人 ID，便于调用方匹配在途请求
  int32 touid = 3;
}

// 顶号通知：新会话拿到更高 epoch 后，旧连接必须立即退出
message KickSessionReq {
  int32 uid = 1;
  // StatusServer 刚授予的新 epoch，旧实例用它判断本地连接是否已经过期
  int64 epoch = 2;
  // 1 同账号异地登录 / 2 登录过期 / 3 服务端下线，客户端按它选择提示语
  int32 reason = 3;
  // 被顶替的旧连接 ID：必须按连接而不是按 uid 定位，
  // 否则新连接可能已经写入本地 uid 映射，踢人请求会打到新连接上
  string session_id = 4;
}

message KickSessionRsp {
  int32 error = 1;
  // true 表示本实例确实找到并关闭了该连接
  bool closed = 2;
}

// 好友申请通过的请求
message AuthFriendReq {
  // 通过申请的一方，即原被申请人
  int32 fromuid = 1;
  // 被添加的一方，即原申请人，需要收到"对方已通过"的通知
  int32 touid = 2;
  // 两人共用的单聊会话 ID，接收方据此把欢迎消息挂到对应会话
  int64 thread_id = 3;
  // 两条欢迎消息（申请方留言 + 通过方默认句），按 message_id 升序
  repeated TextChatData welcome_msgs = 4;
  // 申请方当初给通过方设的备注，通过后回传给申请方，避免要重新登录才看到
  string back = 5;
  // 申请方当初选的分组标签，通过后随通知带回
  repeated string tags = 6;
}

// 好友申请通过的响应
message AuthFriendRsp {
  // 业务错误码，0 表示成功
  int32 error = 1;
  // 回显通过方 ID
  int32 fromuid = 2;
  // 回显被添加方 ID
  int32 touid = 3;
  // 回显单聊会话 ID，0 表示会话创建失败但不影响好友关系
  int64 thread_id = 4;
  // 回显欢迎消息，便于调用方核对本次写入结果
  repeated TextChatData welcome_msgs = 5;
}

// 跨实例转发文本消息的请求
message TextChatMsgReq {
  // 发送方用户 ID
  int32 fromuid = 1;
  // 接收方用户 ID
  int32 touid = 2;
  // 本次要投递的消息段，允许一次携带多条
  repeated TextChatData textmsgs = 3;
  // 消息所属的单聊会话 ID，接收方按它归入对应会话
  int64 thread_id = 4;
}

// 单条文本消息
message TextChatData {
  // 客户端生成的消息唯一标识，用于去重和回执关联
  string msgid = 1;
  // 消息正文
  string msgcontent = 2;
  // 服务端 chat_message 自增主键，决定会话内显示顺序；0 表示尚未落库
  int64 message_id = 3;
  // 消息状态：1 已发送 / 2 发送失败 / 3 未读
  int32 status = 4;
  // 发送者用户 ID
  int32 fromuid = 5;
  // 接收者用户 ID
  int32 touid = 6;
  // 落库时间（UNIX 秒），跨实例转发时原样带走，接收方时间条与排序都用它
  int64 time = 7;
}

// 跨实例转发文本消息的响应
message TextChatMsgRsp {
  // 业务错误码，0 表示成功
  int32 error = 1;
  // 回显发送方 ID
  int32 fromuid = 2;
  // 回显接收方 ID
  int32 touid = 3;
  // 回显本次投递的消息段，便于发送方确认哪些消息已被转发
  repeated TextChatData textmsgs = 4;
  // 回显消息所属的单聊会话 ID
  int64 thread_id = 5;
}

// 资源上传完成的请求：由 ResourceServer 在聊天图片全部落盘后发给 ChatServer
message NotifyImageUploadedReq {
  // chat_message 自增主键，图片消息落库时已经返回给客户端并随分片带给 ResourceServer
  int64 message_id = 1;
  // 发送者 uid，用于日志与后续推送定位
  int32 sender = 2;
  // 会话 ID
  int64 thread_id = 3;
  // 资源文件名
  string name = 4;
  // 接收者 uid：资源服务器按它向状态服务查询，把推送发到对方所在的 ChatServer
  int32 receiver = 5;
  // 发送方客户端消息 ID，接收方用它与历史消息去重
  string client_msg_id = 6;
  // 资源文件大小，接收方展示下载进度
  int64 total_size = 7;
  // 会话类型：1 单聊 / 2 群聊。群聊时 receiver 为发送者，由 ChatServer 按成员广播
  int32 thread_type = 8;
}

// 资源上传完成的响应
message NotifyImageUploadedRsp {
  // 业务错误码，0 表示状态已更新；消息不存在或数据库失败返回非 0
  int32 error = 1;
  // 回显消息 ID
  int64 message_id = 2;
}

// 资料变更广播请求：资源服务器换了头像后，请该用户所在实例查好友并分发
message BroadcastProfileReq {
  // 改了资料的 uid，实例名由资源服务器向状态服务查询
  int32 uid = 1;
}

// 资料变更广播响应
message BroadcastProfileRsp {
  // 业务错误码，0 表示已经进入分发流程；用户不在本实例或查询失败返回非 0
  int32 error = 1;
}

// 跨实例资料变更通知：一次携带同一实例上的多个好友，避免逐个建立 RPC
message ProfileChangedReq {
  // 改了资料的人，客户端据此定位是哪位好友
  int32 fromuid = 1;
  // 需要收到通知的好友，必须在本实例上
  repeated int32 touids = 2;
  // 变更后的资料字段，客户端整体覆盖本地缓存
  string nick = 3;
  string desc = 4;
  string icon = 5;
  int32 sex = 6;
}

// 跨实例资料变更响应
message ProfileChangedRsp {
  // 业务错误码，0 表示通知已投递；实例不在线或参数非法返回非 0
  int32 error = 1;
}

// 会话事件：已读或撤回，只通知对方一个人，因此不需要批量列表
message ChatEventReq {
  // 触发事件的人：已读时是读取者，撤回时是发送者
  int32 fromuid = 1;
  // 要收到通知的对方
  int32 touid = 2;
  int64 thread_id = 3;
  // 已读时表示"读到哪一条"，撤回时表示被撤回的消息
  int64 message_id = 4;
  // 1 已读 / 2 撤回
  int32 event = 5;
}

message ChatEventRsp {
  // 业务错误码，0 表示已投递
  int32 error = 1;
}
